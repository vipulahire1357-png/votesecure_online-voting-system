{% extends "base.html" %}
{% block title %}Add Election — VoteSecure{% endblock %}

{% block content %}
<div class="page-header">
  <h1><span class="icon">➕</span> Create Election</h1>
  <a href="{{ url_for('elections') }}" class="btn btn-outline">← Back to Elections</a>
</div>

<div class="form-card">
  <div class="form-header">🏛️ New Election Details</div>
  <form method="POST">
    <div class="form-group">
      <label for="name">Election Name *</label>
      <input type="text" id="name" name="name" placeholder="e.g. Student Council Election 2025" required />
    </div>
    <div class="form-group">
      <label for="date">Election Date *</label>
      <input type="date" id="date" name="date" required />
    </div>
    <div class="form-group">
      <label for="status">Initial Status</label>
      <select id="status" name="status">
        <option value="upcoming">Upcoming</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Election</button>
  </form>
</div>
{% endblock %}
